<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HEURIAL tracker</title>
<link rel="icon" href="/brand/emblem.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0b">
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong colours.
  let t = "dark"; try { t = localStorage.getItem("hp-theme") || "dark"; } catch {}
  document.documentElement.dataset.theme = t;
</script>
<link rel="stylesheet" href="/tracker/tracker.css">
</head>
<body>
<noscript>The tracker needs JavaScript to run.</noscript>
<!-- The real tracker. The interface is shared with the public demo (/tracker/tracker.js); this page only supplies
     the data source: the signed-in owner's session and the /api/admin/* routes. -->
<script src="/tracker/tracker.js"></script>
<script>
const json = (res) => res.json().catch(() => ({}));
const fail = (message, status) => Object.assign(new Error(message), { status });

async function api(path, method = "GET", body) {
  const url = path.replace(/^\/api\//, "/api/admin/");
  let res;
  try {
    res = await fetch(url, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw fail("Couldn't reach the tracker. Check your connection and try again.", 0);
  }
  const data = await json(res);
  if (res.status === 401) throw fail(data.error || "Please sign in.", 401);
  if (!res.ok) throw fail(data.error || "Request failed.", res.status);
  return data;
}

const auth = {
  async check() { return json(await fetch("/api/admin/session", { credentials: "same-origin" })); },
  async signIn(password) {
    const res = await fetch("/api/admin/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }) });
    if (!res.ok) throw fail((await json(res)).error || "Couldn't sign in.", res.status);
  },
  async signOut() { await fetch("/api/admin/session", { method: "DELETE", credentials: "same-origin" }); },
};

HeurialTracker.start({ mode: "live", api, auth });
</script>
</body>
</html>
