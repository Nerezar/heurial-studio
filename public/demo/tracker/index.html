<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HEURIAL tracker (demo)</title>
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong colours.
  let t = "dark"; try { t = localStorage.getItem("hp-theme") || "dark"; } catch {}
  document.documentElement.dataset.theme = t;
</script>
<link rel="stylesheet" href="/tracker/tracker.css">
</head>
<body>
<noscript>The tracker needs JavaScript to run.</noscript>
<!-- The public demo. Same interface as the real tracker (/tracker/tracker.js), but all data is made up and lives
     in this page's memory: nothing is saved or sent, and a refresh starts over. -->
<script src="/demo/tracker/core.js"></script>
<script src="/tracker/tracker.js"></script>
<script>
/* ---------- Demo back end: sample data in memory, same routes and logic as the real tracker ---------- */
const core = window.__core.exports;
const demoTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Chicago"; } catch { return "America/Chicago"; } })();
const demo = (() => {
  const today = core.todayIn(demoTz);
  const day = (n) => core.addDays(today, n);
  let next = 141722000000040000n;
  const id = () => String(next++);
  const mk = (name, business, source, status, ago, value, extra = {}) => ({
    ROWID: id(), name, business, email: `${name.split(" ")[0].toLowerCase()}@example.com`, source, status,
    booked_at: day(-ago), call_at: day(-Math.max(0, ago - 2)), follow_up_at: "", follow_up_note: "",
    value_cents: value * 100, notes: "", inquiry_id: "", ...extra,
  });
  const leads = [
    mk("Dana Whitfield", "Whitfield Plumbing", "Personal network", "paid", 52, 495),
    mk("Marcus Bell", "Bell Fitness Studio", "Referral", "paid", 44, 495),
    mk("Greg Haldane", "Haldane Roofing", "Referral", "paid", 33, 1200, { follow_up_at: day(10), follow_up_note: "Ask for a testimonial" }),
    mk("Aisha Rahman", "Rahman Dental", "Referral", "paid", 27, 1500, { follow_up_at: day(14), follow_up_note: "Ask about a second workflow" }),
    mk("Ben Carter", "Carter Law Office", "Website", "proposal", 21, 1500, { follow_up_at: day(-3), follow_up_note: "Check if he's reviewed the proposal" }),
    mk("Elena Petrova", "Petrova Bookkeeping", "Partner", "proposal", 13, 1200, { follow_up_at: day(0), follow_up_note: "Send the revised scope" }),
    mk("Chris Doyle", "Doyle Electric", "Instagram", "held", 9, 0, { follow_up_at: day(2), follow_up_note: "Ask about the booking inbox" }),
    mk("Mia Fontaine", "Fontaine Yoga", "Website", "held", 8, 0, { follow_up_at: day(5), follow_up_note: "Share a sample FAQ assistant" }),
    mk("Owen Pike", "Pike Landscaping", "Cold outreach", "lost", 18, 0),
    mk("Hannah Cho", "Cho Photography", "Instagram", "no_show", 15, 0),
    mk("Ryan Kowalski", "Kowalski Cleaning", "Cold outreach", "booked", 6, 0, { call_at: day(-2) }),
    mk("Grace Lindqvist", "Lindqvist Interiors", "Website", "booked", 1, 0, { call_at: day(2) }),
  ];
  const time = [];
  for (const l of leads.filter((x) => x.status === "paid")) {
    time.push({ ROWID: id(), lead_id: l.ROWID, entry_date: day(-25), hours: 4, note: "Call and scoping" });
    time.push({ ROWID: id(), lead_id: l.ROWID, entry_date: day(-22), hours: 3, note: "Build and testing" });
    time.push({ ROWID: id(), lead_id: l.ROWID, entry_date: day(-20), hours: 1.5, note: "Handoff and guide" });
  }
  const ago = (h) => new Date(Date.now() - h * 36e5).toISOString();
  const inquiries = [
    { ROWID: id(), inquiry_id: "demo-0001", created_at: ago(5), name: "Ivy Romero", email: "ivy@example.com", company: "Ivy Lane Salon", source: "Instagram",
      source_detail: "tracking link ?src=instagram", status: "new", message: "Booking requests come in through DMs and I miss half of them. Can you help?" },
    { ROWID: id(), inquiry_id: "demo-0002", created_at: ago(26), name: "Sam Ortiz", email: "sam@example.com", company: "Ortiz HVAC", source: "Search",
      source_detail: "came from google.com", status: "new", message: "We answer the same ten questions every day on the phone." },
  ];
  return { today, leads, time, inquiries, id };
})();

const demoStore = { Leads: demo.leads, TimeEntries: demo.time, Inquiries: demo.inquiries };
const bad = (message, status = 400) => Object.assign(new Error(message), { status });

async function api(path, method = "GET", body) {
  await new Promise((r) => setTimeout(r, 60)); // feels like a real request
  const url = new URL(path.replace(/^\/api\//, "/"), "http://demo");
  const p = url.pathname.replace(/^\/+|\/+$/g, "");
  const today = demo.today;
  const find = (rows, id) => rows.find((r) => String(r.ROWID) === String(id));
  const all = () => ({ leadRows: demo.leads, timeRows: demo.time, inquiryRows: demo.inquiries });
  const wrap = (fn) => { try { return fn(); } catch (e) { if (e instanceof core.Bad) throw bad(e.message, e.status); throw e; } };
  let m;

  if (method === "GET" && p === "data") return wrap(() => ({ ...core.summarize({ ...all(), range: url.searchParams.get("range") || "30", today }), demo: true }));
  if (method === "POST" && p === "leads") return wrap(() => { const row = { ...core.cleanLead(body, false, today), inquiry_id: "", ROWID: demo.id() }; demo.leads.push(row); return { id: row.ROWID }; });
  if ((m = p.match(/^leads\/(\d+)$/))) {
    const row = find(demo.leads, m[1]);
    if (!row) throw bad("Not found.", 404);
    if (method === "GET") { const hours = demo.time.filter((t) => String(t.lead_id) === m[1]).reduce((s, t) => s + t.hours, 0); return core.leadFromRow(row, { [m[1]]: hours }); }
    if (method === "PATCH") { Object.assign(row, wrap(() => core.cleanLead(body, true, today))); return { ok: true }; }
    if (method === "DELETE") { demo.leads.splice(demo.leads.indexOf(row), 1); for (let i = demo.time.length - 1; i >= 0; i--) if (String(demo.time[i].lead_id) === m[1]) demo.time.splice(i, 1); return { ok: true }; }
  }
  if ((m = p.match(/^leads\/(\d+)\/time$/)) && method === "GET")
    return demo.time.filter((t) => String(t.lead_id) === m[1]).map((t) => ({ id: t.ROWID, lead_id: t.lead_id, entry_date: t.entry_date, hours: t.hours, note: t.note || "" })).sort((a, b) => b.entry_date.localeCompare(a.entry_date));
  if (method === "POST" && p === "time") return wrap(() => {
    const e = core.cleanTime(body, today);
    if (!find(demo.leads, e.lead_id)) throw bad("Not found.", 404);
    demo.time.push({ ...e, ROWID: demo.id() }); return { ok: true };
  });
  if ((m = p.match(/^time\/(\d+)$/)) && method === "DELETE") { const i = demo.time.findIndex((t) => String(t.ROWID) === m[1]); if (i >= 0) demo.time.splice(i, 1); return { ok: true }; }
  if ((m = p.match(/^inbox\/(\d+)\/(convert|dismiss)$/)) && method === "POST") {
    const q = find(demo.inquiries, m[1]);
    if (!q) throw bad("Not found.", 404);
    if (q.status !== "new") throw bad("This inquiry was already handled.", 409);
    let leadId;
    if (m[2] === "convert") { const row = { ...core.leadFromInquiry(q, today), ROWID: demo.id() }; demo.leads.push(row); leadId = row.ROWID; }
    q.status = m[2] === "convert" ? "converted" : "dismissed";
    return { ok: true, leadId };
  }
  if (method === "POST" && p === "digest") {
    const d = core.buildDigest(core.summarize({ ...all(), range: "7", today }), { trackerUrl: "" });
    return { ...d, sent: false };
  }
  throw bad("Not found.", 404);
}

HeurialTracker.start({ mode: "demo", api });
</script>
</body>
</html>
